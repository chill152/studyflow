<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký – StudyFlow</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo"><span>📘</span> StudyFlow</div>
    <p class="auth-sub">Tạo tài khoản miễn phí ngay hôm nay</p>

    <div class="form-error" id="regError"></div>

    <div class="form-group">
      <label for="fullname">Họ và tên</label>
      <input type="text" id="fullname" placeholder="Nguyễn Văn A" />
    </div>
    <div class="form-group">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Tối thiểu 3 ký tự" autocomplete="username" />
      <div class="form-hint">Chỉ dùng chữ cái, số, gạch dưới. Không thay đổi được sau khi đăng ký.</div>
    </div>
    <div class="form-group">
      <label for="email">Email (không bắt buộc)</label>
      <input type="email" id="email" placeholder="example@email.com" />
    </div>
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="confirm">Xác nhận mật khẩu</label>
      <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
    </div>

    <button class="btn btn-primary" id="regBtn">✨ Tạo tài khoản</button>

    <div class="auth-footer">
      Đã có tài khoản? <a href="./login.html">Đăng nhập</a>
    </div>
  </div>

  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/script.js"></script>
  <script>
    if (getSession() && getCurrentUser()) window.location.href = "./index.html";

    document.getElementById("regBtn").addEventListener("click", async () => {
      const fullname = document.getElementById("fullname").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const errEl = document.getElementById("regError");
      errEl.classList.remove("show");

      if (password !== confirm) {
        errEl.textContent = "Mật khẩu xác nhận không khớp.";
        errEl.classList.add("show");
        return;
      }

      try {
        document.getElementById("regBtn").textContent = "Đang tạo tài khoản...";
        document.getElementById("regBtn").disabled = true;
        await registerUser({ username, password, fullname, email });
        await loginUser(username, password);
        window.location.href = "./index.html";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add("show");
        document.getElementById("regBtn").textContent = "✨ Tạo tài khoản";
        document.getElementById("regBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
