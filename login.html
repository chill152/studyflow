<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập – StudyFlow</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo"><span>📘</span> StudyFlow</div>
    <p class="auth-sub">Nền tảng học tập cá nhân của bạn</p>

    <div class="form-error" id="loginError"></div>

    <div class="form-group">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary" id="loginBtn">🔐 Đăng nhập</button>

    <div class="auth-footer">
      Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
    </div>
  </div>

  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/script.js"></script>
  <script>
    // Nếu đã đăng nhập thì chuyển thẳng vào dashboard
    if (getSession() && getCurrentUser()) window.location.href = "./index.html";

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("loginError");
      errEl.classList.remove("show");

      if (!username || !password) {
        errEl.textContent = "Vui lòng nhập tên đăng nhập và mật khẩu.";
        errEl.classList.add("show");
        return;
      }

      try {
        document.getElementById("loginBtn").textContent = "Đang đăng nhập...";
        document.getElementById("loginBtn").disabled = true;
        await loginUser(username, password);
        window.location.href = "./index.html";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add("show");
        document.getElementById("loginBtn").textContent = "🔐 Đăng nhập";
        document.getElementById("loginBtn").disabled = false;
      }
    });

    // Enter key
    ["username", "password"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });
    });
  </script>
</body>
</html>
