<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thống kê – StudyFlow</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div id="app-layout"></div>
  <main class="main-content">
    <div class="page">
      <div class="page-header">
        <div>
          <h1>📊 Thống kê</h1>
          <p>Phân tích tiến trình học tập của bạn</p>
        </div>
      </div>

      <!-- Summary row -->
      <div class="grid grid-4" id="statSummary" style="margin-bottom:24px"></div>

      <!-- Charts row 1 -->
      <div class="grid grid-2" style="margin-bottom:18px">
        <div class="card">
          <div class="section-title" style="margin-top:0">✅ Trạng thái nhiệm vụ</div>
          <canvas id="taskStatusChart" height="220"></canvas>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">🎯 Phân bổ ưu tiên</div>
          <canvas id="priorityChart" height="220"></canvas>
        </div>
      </div>

      <!-- Charts row 2 -->
      <div class="grid grid-2">
        <div class="card">
          <div class="section-title" style="margin-top:0">📈 Điểm theo môn học</div>
          <canvas id="subjectGradeChart" height="220"></canvas>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">⏱️ Pomodoro 7 ngày qua</div>
          <canvas id="pomodoroWeekChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/script.js"></script>
<script src="./assets/js/statistics.js"></script>
<script>
  initAppPage("statistics");

  const tasks = getUserData("tasks", []);
  const subjects = getUserData("subjects", []);
  const grades = getUserData("grades", []);
  const pStats = getUserData("pomodoro_stats", {sessions:0, minutes:0});
  const doneTasks = tasks.filter(t => t.done).length;

  const summaryData = [
    { icon:"📚", label:"Tổng môn học", num:subjects.length, bg:"#eef2ff", c:"#4f46e5" },
    { icon:"✅", label:"Nhiệm vụ hoàn thành", num:`${doneTasks}/${tasks.length}`, bg:"#dcfce7", c:"#16a34a" },
    { icon:"🎯", label:"Môn có điểm", num:grades.length, bg:"#fef3c7", c:"#f59e0b" },
    { icon:"🍅", label:"Tổng phiên Pomodoro", num:pStats.sessions, bg:"#ffe4e6", c:"#ef4444" },
  ];

  document.getElementById("statSummary").innerHTML = summaryData.map(s => `
    <div class="card stat-card">
      <div class="stat-icon" style="background:${s.bg};color:${s.c};font-size:1.4rem">${s.icon}</div>
      <div><div class="num">${s.num}</div><div class="label">${s.label}</div></div>
    </div>`).join("");
</script>
</body>
</html>
